<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Registration</h2>
            <!-- Сообщения об ошибках и успехе -->
            <div id="error-message" class="alert alert-danger" style="display: none;">
                Ошибка регистрации. Пожалуйста, проверьте введённые данные.
            </div>
            <div id="success-message" class="alert alert-success" style="display: none;">
                Регистрация прошла успешно! Вы будете перенаправлены на страницу входа.
            </div>
            <!-- Форма регистрации -->
            <form id="registration-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<script>
    document.getElementById('registration-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Отменяем стандартную отправку формы

        // Получаем данные из формы
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Проверяем, совпадают ли пароли
        if (password !== confirmPassword) {
            document.getElementById('error-message').textContent = 'Пароли не совпадают.';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
            return;
        }

        // Отправляем данные на сервер
        fetch(localStorage.getItem("serverURL") + '/reg', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка регистрации');
            }
            return response.json(); // Предполагаем, что сервер возвращает JSON с токеном
        })
        .then(data => {
            // Сохраняем токен в localStorage
            localStorage.setItem('accessToken', data.accessToken);
            localStorage.setItem('refreshToken', data.refreshToken);

            // Показываем сообщение об успехе
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';

            localStorage.setItem("loadPage", "/menu");           
        })
        .catch(error => {
            // Показываем сообщение об ошибке
            document.getElementById('error-message').textContent = 'Ошибка регистрации: ' + error.message;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
            console.error('Ошибка:', error);
        });
    });
</script>
</body>
</html>
